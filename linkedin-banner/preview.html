<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Look Twice — LinkedIn banner variations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="banner.css">
</head>
<body>

<label class="preview-toggle">
  <input type="checkbox" id="safe-toggle">
  Show LinkedIn profile-pic safe zone (dashed rounded square = where the company logo will sit)
</label>

<div>
  <p class="preview-label">V1 — split / staggered bars / italic "again"</p>
  <div class="banner banner--split" data-variant="v1">
    <div class="split-stack">
      <div class="row row--left">
        <p class="banner__line">Look <em>again</em> at your brand ...</p>
        <div class="bar" aria-hidden="true"></div>
      </div>
      <div class="row row--right">
        <div class="bar" aria-hidden="true"></div>
        <p class="banner__line banner__line--right">...this time through your customer's eyes</p>
      </div>
    </div>
  </div>
</div>

<div>
  <p class="preview-label">V2 — split / staggered bars / italic "customer's eyes"</p>
  <div class="banner banner--split" data-variant="v2">
    <div class="split-stack">
      <div class="row row--left">
        <p class="banner__line">Look again at your brand ...</p>
        <div class="bar" aria-hidden="true"></div>
      </div>
      <div class="row row--right">
        <div class="bar" aria-hidden="true"></div>
        <p class="banner__line banner__line--right">...this time through your <em>customer's&nbsp;eyes</em></p>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('safe-toggle').addEventListener('change', e => {
    document.body.classList.toggle('show-safe', e.target.checked);
  });
</script>

</body>
</html>
