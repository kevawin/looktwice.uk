<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Look Twice | Independent brand and customer experience strategy</title>
  <meta name="description" content="Independent brand and customer experience strategy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #e3e3f4;
      --navy-mid: #e3e3f499;
      --navy-soft: #e3e3f4cc;
    }

    html, body {
      height: 100%;
    }

    body {
      background: linear-gradient(135deg,
        #ff9900 0%,
        #ff4400 25%,
        #ff1144 45%,
        #ff0077 65%,
        #cc00aa 82%,
        #5500aa 100%
      );
      background-attachment: fixed;
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 4rem 6rem;
    }

    header {
      margin-bottom: 4rem;
    }

    .wordmark {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(1.9rem, 4vw, 2.25rem);
      letter-spacing: 0.04em;
      color: var(--navy);
    }

    .tagline {
      margin-top: 0.5rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      color: var(--navy-soft);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    main {
      max-width: 38rem;
    }

    .headline {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      line-height: 1.2;
      margin-bottom: 1.5rem;
      color: var(--navy);
    }

    .body-text {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: clamp(0.95rem, 1.5vw, 1.05rem);
      line-height: 1.75;
      color: var(--navy-soft);
    }

    .body-text p + p {
      margin-top: 1.5rem;
    }

    .body-text a {
      color: var(--navy);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--navy-mid);
      transition: text-decoration-color 0.2s ease;
    }

    .body-text a:hover {
      text-decoration-color: var(--navy);
    }

    footer {
      margin-top: 3rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--navy-mid);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.20);
      pointer-events: none;
      z-index: 0;
    }

    header, main, footer {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 640px) {
      body {
        padding: 3rem 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <header>
    <div class="wordmark">Look Twice</div>
    <div class="tagline">Independent brand &amp; customer experience strategy</div>
  </header>

  <main>
    <h1 class="headline">Not quite ready for your second look.</h1>

    <div class="body-text">
      <p>Curious? Find me on <a href="https://www.linkedin.com/in/krisevawin/" target="_blank" rel="noopener noreferrer">LinkedIn</a> in the meantime.</p>
      <p>Or if your brand makes a promise your experience isn&rsquo;t keeping, let&rsquo;s talk: <a href="mailto:hello@looktwice.uk">hello@looktwice.uk</a></p>
    </div>
  </main>

  <footer>&copy; 2026 Look Twice</footer>

</body>
</html>
