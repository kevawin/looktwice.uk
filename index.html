<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look Twice</title>

  <!-- Phase 1: minimal meta. Phase 5 (SEO) adds description, og:, canonical, JSON-LD. -->

  <!-- Preload critical font weight (400, used by nav links and body). -->
  <!-- crossorigin is mandatory for fonts even when same-origin (browser refetches without it). -->
  <link rel="preload" href="/fonts/epilogue-400.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Stylesheets in cascade order: tokens → base → layout → components → animations. Do not @import; @import is render-blocking sequential. -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

  <nav class="nav" aria-label="Primary navigation">
    <a class="nav-wordmark" href="/">Look Twice</a>
    <button class="nav-hamburger"
            type="button"
            aria-expanded="false"
            aria-controls="nav-overlay"
            aria-label="Open menu">
      <span class="nav-hamburger-line" aria-hidden="true"></span>
      <span class="nav-hamburger-line" aria-hidden="true"></span>
      <span class="nav-hamburger-line" aria-hidden="true"></span>
    </button>
    <ul class="nav-links" role="list">
      <li><a class="nav-link" href="#work">WORK</a></li>
      <li><a class="nav-link" href="#approach">APPROACH</a></li>
      <li><a class="nav-link" href="#contact">CONTACT</a></li>
    </ul>
  </nav>

  <div id="nav-overlay" class="nav-overlay" aria-hidden="true">
    <button class="nav-overlay-close"
            type="button"
            aria-label="Close menu">&times;</button>
    <nav aria-label="Mobile navigation">
      <a class="nav-overlay-link" href="#work">WORK</a>
      <a class="nav-overlay-link" href="#approach">APPROACH</a>
      <a class="nav-overlay-link" href="#contact">CONTACT</a>
    </nav>
  </div>

  <main>
    <section id="hero" class="hero">
      <div class="hero__inner">
        <div class="hero__text">
          <h1 class="hero__headline">
            Your brand makes a promise.<br>
            But is your experience breaking it?
          </h1>
          <p class="hero__subhead">
            I find where brand promise and experience are out of step. Then close the gap.
          </p>
          <div class="hero__ctas">
            <a class="btn btn--primary" href="#contact">BOOK A SESSION</a>
            <a class="btn btn--ghost-on-dark" href="#work">SEE THE WORK</a>
          </div>
        </div>

        <div class="hero__cutouts" aria-hidden="false">
          <picture class="hero__cutout hero__cutout--main">
            <img src="/images/kris-portrait.webp"
                 alt="Kristina Evawin, brand and CX strategist"
                 width="800"
                 height="1000"
                 loading="eager"
                 decoding="async"
                 fetchpriority="high">
          </picture>
          <!-- Supporting cutout: image not yet committed.
               Per D-10 the markup ships the picture/img with the agreed path,
               and a Midnight token-block fallback (.hero__cutout-fallback) renders behind it.
               When images/hero-supporting.webp lands later, the fallback drops out via CSS attribute selector, no markup change. -->
          <div class="hero__cutout hero__cutout--support">
            <div class="hero__cutout-fallback" aria-hidden="true"></div>
            <picture class="hero__cutout-image">
              <img src="/images/hero-supporting.webp"
                   alt="A working session: hands annotating printed brand research on a desk"
                   width="500"
                   height="500"
                   loading="eager"
                   decoding="async"
                   onerror="this.parentElement.parentElement.classList.add('hero__cutout--missing'); this.remove();">
            </picture>
          </div>
        </div>
      </div>
    </section>
    <section id="situation"></section>
    <section id="approach"></section>
    <section id="work"></section>
    <section id="services"></section>
    <section id="contact"></section>
  </main>

  <footer class="footer footer--placeholder">
    <!-- Phase 4 populates this -->
  </footer>

  <script src="/js/main.js" defer></script>
</body>
</html>
