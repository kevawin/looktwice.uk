<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    padding: 4vw;
    background: linear-gradient(to bottom right, #FF512F, #DD2476);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }

  .row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 3vw;
  }

  .headline {
    flex: 1;
    margin: 0;
    font-size: 80px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.025em;
  }

  .stage {
    flex: 1;
    display: flex;
    justify-content: flex-end;
  }

  .picture {
    width: 40vw;
  }

  /* SVG renders the image masked to ONLY show inside the shape regions.
     Everywhere else is transparent → body gradient shows through. */
  .windows {
    display: block;
    width: 100%;
  }

  @media (max-width: 500px) {
    body {
      padding: 8vw 5vw;
    }

    .row {
      flex-direction: column-reverse;
      align-items: stretch;
      gap: 6vw;
    }

    .headline {
      flex: none;
      font-size: 40px;
    }

    .stage {
      flex: none;
      justify-content: center;
    }

    .picture {
      width: 60vw;
    }
  }
</style>
